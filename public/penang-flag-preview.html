*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#fcf8f2;color:#352a25;font-family:system-ui,sans-serif}main{text-align:center;padding:32px}h1{font-size:24px;font-weight:500;margin:24px 0 8px}p{font-size:14px;color:#796b60}
.flag{position:relative;display:inline-block;max-width:100%;aspect-ratio:3/2;vertical-align:middle;container-type:inline-size}
.flag img{display:block;width:100%;height:auto;user-select:none}
.fabric{display:none;position:absolute;inset:0;pointer-events:none}
.strip{position:absolute;top:0;height:100%;background-image:url('/images/penang-flag-only-3d.webp');background-repeat:no-repeat;background-size:4000% 100%;transform-origin:center;animation:penang-wind 3s cubic-bezier(.37,0,.63,1) var(--delay) infinite}
@media(prefers-reduced-motion:no-preference){.animated img{visibility:hidden}.animated .fabric{display:block}}
@keyframes penang-wind{
 0%,100%{transform:translateY(0) skewY(calc(-1 * var(--bend)))}
 25%{transform:translateY(var(--amplitude)) skewY(0deg)}
 50%{transform:translateY(0) skewY(var(--bend))}
 75%{transform:translateY(calc(-1 * var(--amplitude))) skewY(0deg)}
}
